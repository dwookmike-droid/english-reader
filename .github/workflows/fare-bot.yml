name: 항공권 시세 봇

on:
  schedule:
    - cron: "0 23 * * *"      # 매일 08:00 KST — 정기 요약 발송
    - cron: "*/15 * * * *"    # 15분마다 — 받은 질문에 답장
  workflow_dispatch:
    inputs:
      mode:
        description: 실행할 모드
        type: choice
        options: [digest, poll]
        default: digest

concurrency:
  group: fare-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 모드 결정
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ inputs.mode }}" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event.schedule }}" = "0 23 * * *" ]; then
            echo "value=digest" >> "$GITHUB_OUTPUT"
          else
            echo "value=poll" >> "$GITHUB_OUTPUT"
          fi

      # poll 모드는 마지막으로 읽은 메시지 번호를 캐시에 들고 다닌다.
      # 캐시가 없으면 봇은 묵은 메시지에 뒤늦게 답하지 않고 넘긴다.
      - name: 오프셋 캐시
        if: steps.mode.outputs.value == 'poll'
        uses: actions/cache@v4
        with:
          path: bot/state.json
          key: fare-bot-state-${{ github.run_id }}
          restore-keys: fare-bot-state-

      - name: 실행
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 bot/fare_bot.py ${{ steps.mode.outputs.value }}
