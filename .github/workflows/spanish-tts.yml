# 「그라시아의 열쇠」 대사 음성을 Gemini 무료 한도 안에서 매일 조금씩 만든다.
# 저장소 Settings → Secrets and variables → Actions 에 GEMINI_API_KEY 를 넣어야 돈다.
# 무료 한도는 미국 태평양 시간 자정에 풀린다. 그 직후(UTC 08:23 = 한국 17:23)에 실행한다.
name: spanish-tts
on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency: spanish-tts
jobs:
  tts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 음성 만들기
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then echo "GEMINI_API_KEY 시크릿이 없어 건너뜁니다."; exit 0; fi
          python3 spanish/tts.py
      - name: 커밋 (도중에 실패해도 만든 것까지는 저장)
        if: always()
        run: |
          git config user.name "spanish-tts"
          git config user.email "actions@users.noreply.github.com"
          git add audio es.html
          git diff --cached --quiet && exit 0
          git commit -m "음성 추가 — $(ls audio/es/*.mp3 | wc -l)개 파일"
          git push
