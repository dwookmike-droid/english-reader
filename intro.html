<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>네 권의 책 미리보기</title>
</head><body>
<style>
  :root {
    --paper: #fbfaf7; --ink: #21201c; --muted: #6f6a60; --rule: #e2ded4; --card: #ffffff;
    --gold: #a9762a;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #16181a; --ink: #e8e4dc; --muted: #9b958a; --rule: #2b2e31; --card: #1d2023; --gold: #e0b062;
    }
  }
  :root[data-theme="dark"] {
    --paper: #16181a; --ink: #e8e4dc; --muted: #9b958a; --rule: #2b2e31; --card: #1d2023; --gold: #e0b062;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Pretendard", "Noto Sans KR", sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 28px 16px 48px; }
  .top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 14px; }
  .top a { color: var(--muted); font-size: 13px; text-decoration: none; }
  .top a:hover { color: var(--ink); }
  .eyebrow { font-size: 11px; letter-spacing: .24em; text-transform: uppercase; color: var(--muted); margin: 0; }
  .stage {
    position: relative; width: 100%; aspect-ratio: 16 / 10; background: #101214;
    border-radius: 4px; overflow: hidden; border: 1px solid var(--rule);
  }
  canvas { display: block; width: 100%; height: 100%; }
  .ctl { display: flex; align-items: center; gap: 10px; margin-top: 12px; }
  .ctl button {
    font: inherit; font-size: 13px; padding: 6px 12px; border: 1px solid var(--rule);
    border-radius: 7px; background: var(--card); color: var(--ink); cursor: pointer; min-width: 64px;
  }
  .ctl button:focus-visible, .scene:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .bar { flex: 1; height: 4px; background: var(--rule); border-radius: 2px; position: relative; cursor: pointer; touch-action: none; }
  .bar i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--gold); border-radius: 2px; }
  .scenes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 16px; }
  .scene {
    display: block; padding: 10px 10px 11px; border: 1px solid var(--rule); border-top: 3px solid var(--tint);
    border-radius: 3px; background: var(--card); color: inherit; text-decoration: none; font-size: 12.5px; line-height: 1.35;
  }
  .scene b { display: block; font-size: 14px; font-weight: 600; margin-bottom: 2px; }
  .scene span { color: var(--muted); }
  .scene.on { border-color: var(--tint); }
  @media (max-width: 520px) { .scenes { grid-template-columns: 1fr 1fr; } .stage { aspect-ratio: 4 / 3; } }
</style>

<div class="wrap">
  <div class="top">
    <p class="eyebrow">네 권 미리보기 · 20초</p>
    <a href="index.html">← 책 고르기</a>
  </div>
  <div class="stage"><canvas id="cv" role="img" aria-label="네 권의 책을 차례로 소개하는 애니메이션"></canvas></div>
  <div class="ctl">
    <button id="play" type="button">멈춤</button>
    <div class="bar" id="bar" role="slider" aria-label="재생 위치" tabindex="0"><i id="fill"></i></div>
  </div>
  <div class="scenes" id="scenes">
    <a class="scene" href="sg.html" style="--tint:#6d9a5c"><b>시크릿 가든</b><span>잠긴 정원의 문</span></a>
    <a class="scene" href="po.html" style="--tint:#b5374a"><b>오페라의 유령</b><span>막이 오르는 무대</span></a>
    <a class="scene" href="we.html" style="--tint:#5b80bd"><b>젊은 베르테르의 슬픔</b><span>편지와 깃펜</span></a>
    <a class="scene" href="fr.html" style="--tint:#7fa6bf"><b>프랑켄슈타인</b><span>북극의 번개</span></a>
  </div>
</div>

<script>
(function () {
  // 그림은 draw(t) 하나가 시간 t(초)만 보고 그린다. 프레임 사이에 남기는 상태가 없어서 어느 지점으로 옮겨도 같은 장면이 나온다.
  var DUR = 5, TOTAL = 20;
  var cv = document.getElementById('cv'), cx = cv.getContext('2d');
  var W = 0, H = 0;

  function fit() {
    var r = cv.getBoundingClientRect(), d = Math.min(window.devicePixelRatio || 1, 2);
    cv.width = Math.round(r.width * d); cv.height = Math.round(r.height * d);
    W = r.width; H = r.height; cx.setTransform(d, 0, 0, d, 0, 0);
  }

  function cl(x) { return x < 0 ? 0 : x > 1 ? 1 : x; }
  function ease(x) { x = cl(x); return x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2; }
  function rnd(i) { var x = Math.sin(i * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); }

  function caption(k, en, ko, col) {
    var a = cl(k * 3) * cl((1 - k) * 5);
    var s = Math.min(W, H * 1.6);
    cx.save(); cx.globalAlpha = a; cx.textAlign = 'center';
    cx.fillStyle = 'rgba(0,0,0,.45)'; cx.fillRect(0, H * .76, W, H * .24);
    cx.fillStyle = col;
    cx.font = 'italic ' + Math.max(15, Math.round(s * .048)) + 'px Georgia, "Iowan Old Style", serif';
    cx.fillText(en, W / 2, H * .855 + (1 - ease(k * 3)) * 8);
    cx.fillStyle = 'rgba(255,255,255,.82)';
    cx.font = Math.max(11, Math.round(s * .03)) + 'px -apple-system, "Pretendard", "Noto Sans KR", sans-serif';
    cx.fillText(ko, W / 2, H * .93);
    cx.restore();
  }

  // 1. 시크릿 가든 — 담쟁이가 자라고 잠긴 문이 열린다
  function garden(k) {
    var g = cx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#dfe8d2'); g.addColorStop(1, '#9fb88c');
    cx.fillStyle = g; cx.fillRect(0, 0, W, H);
    var wy = H * .2, dw = W * .14, dh = H * .44, dx = W / 2 - dw / 2, dy = H * .76 - dh;
    cx.fillStyle = '#8a6a55'; cx.fillRect(0, wy, W, H * .56);
    cx.strokeStyle = 'rgba(60,40,30,.25)'; cx.lineWidth = 1;
    for (var r = 0; r < 12; r++) for (var c = 0; c < 20; c++) {
      var bx = c * W / 14 - (r % 2) * W / 28, by = wy + r * H * .047;
      cx.strokeRect(bx, by, W / 14, H * .047);
    }
    // 문 너머의 정원
    var open = ease((k - .5) / .35);
    cx.fillStyle = '#f4f1c9'; cx.fillRect(dx, dy, dw, dh);
    for (var f = 0; f < 18; f++) {
      cx.fillStyle = ['#e58aa0', '#f2c14e', '#ffffff'][f % 3];
      cx.beginPath(); cx.arc(dx + rnd(f) * dw, dy + dh * (.55 + rnd(f + 9) * .4), 2 + rnd(f + 3) * 3, 0, 7); cx.fill();
    }
    cx.save(); cx.translate(dx, dy);
    cx.scale(1 - open * .85, 1);
    cx.fillStyle = '#5a3d2b'; cx.fillRect(0, 0, dw, dh);
    cx.strokeStyle = '#3e2a1d'; cx.lineWidth = 2;
    for (var p = 1; p < 4; p++) { cx.beginPath(); cx.moveTo(dw * p / 4, 0); cx.lineTo(dw * p / 4, dh); cx.stroke(); }
    cx.fillStyle = '#c9a24a'; cx.beginPath(); cx.arc(dw * .82, dh * .55, 3, 0, 7); cx.fill();
    cx.restore();
    // 담쟁이
    var grow = ease(k / .6);
    cx.strokeStyle = '#3f6b34'; cx.lineWidth = 2.2; cx.lineCap = 'round';
    for (var v = 0; v < 5; v++) {
      var x0 = W * (.08 + v * .21), n = 40, top = wy + H * .5;
      cx.beginPath();
      for (var i = 0; i <= n * grow; i++) {
        var y = top - i / n * H * .52, x = x0 + Math.sin(i * .35 + v) * W * .025;
        if (i === 0) cx.moveTo(x, y); else cx.lineTo(x, y);
      }
      cx.stroke();
      for (var l = 0; l < n * grow; l += 4) {
        var ly = top - l / n * H * .52, lx = x0 + Math.sin(l * .35 + v) * W * .025;
        cx.fillStyle = l % 8 ? '#4f8a40' : '#6aa957';
        cx.beginPath(); cx.ellipse(lx + (l % 8 ? 6 : -6), ly, 6, 3, l % 8 ? .5 : -.5, 0, 7); cx.fill();
      }
    }
    // 울새 한 마리가 문 위로 날아든다
    var bk = ease((k - .2) / .4), bxp = W * (1.05 - bk * .5), byp = dy - 14 - Math.sin(bk * Math.PI) * H * .1;
    cx.fillStyle = '#6b4a35'; cx.beginPath(); cx.ellipse(bxp, byp, 9, 7, 0, 0, 7); cx.fill();
    cx.fillStyle = '#d9643a'; cx.beginPath(); cx.arc(bxp - 4, byp + 1, 4.5, 0, 7); cx.fill();
    cx.fillStyle = '#6b4a35'; cx.beginPath(); cx.arc(bxp - 7, byp - 5, 4.5, 0, 7); cx.fill();
    caption(k, 'The Secret Garden', '시크릿 가든 · 10년 동안 잠겨 있던 정원', '#f4f1c9');
  }

  // 2. 오페라의 유령 — 막이 걷히고 샹들리에 아래 가면이 떠오른다
  function opera(k) {
    cx.fillStyle = '#120a0c'; cx.fillRect(0, 0, W, H);
    var spot = cx.createRadialGradient(W / 2, H * .45, 4, W / 2, H * .45, W * .4);
    spot.addColorStop(0, 'rgba(255,230,180,.35)'); spot.addColorStop(1, 'rgba(255,230,180,0)');
    cx.fillStyle = spot; cx.fillRect(0, 0, W, H);
    // 샹들리에
    var sw = Math.sin(k * 6) * .04;
    cx.save(); cx.translate(W / 2, 0); cx.rotate(sw);
    cx.strokeStyle = '#a88a4a'; cx.lineWidth = 1.5;
    cx.beginPath(); cx.moveTo(0, 0); cx.lineTo(0, H * .14); cx.stroke();
    for (var c = 0; c < 9; c++) {
      var a = c / 8 * Math.PI, rx = Math.cos(a) * W * .09, ry = H * .14 + Math.sin(a) * H * .05;
      cx.beginPath(); cx.moveTo(0, H * .14); cx.lineTo(rx, ry); cx.stroke();
      cx.fillStyle = 'rgba(255,214,140,' + (.6 + .4 * Math.sin(k * 20 + c)) + ')';
      cx.beginPath(); cx.arc(rx, ry, 3, 0, 7); cx.fill();
    }
    cx.restore();
    // 가면
    var m = ease((k - .35) / .35), mx = W / 2, my = H * .48, ms = Math.min(W, H) * .17;
    cx.save(); cx.globalAlpha = m; cx.translate(mx, my);
    cx.fillStyle = '#f3efe6';
    cx.beginPath(); cx.moveTo(-ms, -ms * .3);
    cx.quadraticCurveTo(0, -ms * .75, ms, -ms * .3);
    cx.quadraticCurveTo(ms * .9, ms * .5, ms * .1, ms * .45);
    cx.quadraticCurveTo(0, ms * .25, -ms * .1, ms * .45);
    cx.quadraticCurveTo(-ms * .9, ms * .5, -ms, -ms * .3); cx.fill();
    cx.fillStyle = '#120a0c';
    cx.beginPath(); cx.ellipse(-ms * .42, -ms * .05, ms * .22, ms * .12, -.15, 0, 7); cx.fill();
    cx.beginPath(); cx.ellipse(ms * .42, -ms * .05, ms * .22, ms * .12, .15, 0, 7); cx.fill();
    cx.restore();
    // 막
    var o = ease(k / .45) * .42;
    for (var s = 0; s < 2; s++) {
      var dir = s ? 1 : -1, edge = W / 2 + dir * W * o;
      cx.fillStyle = '#7a1e2c';
      cx.beginPath();
      cx.moveTo(s ? W : 0, 0); cx.lineTo(edge, 0);
      cx.quadraticCurveTo(edge + dir * W * o * .3, H * .5, s ? W : 0, H * (.6 + .4 * (1 - o * 2.2)));
      cx.lineTo(s ? W : 0, H); cx.lineTo(s ? W : 0, 0); cx.fill();
      cx.strokeStyle = 'rgba(0,0,0,.25)';
      for (var f = 1; f < 6; f++) {
        var fx = (s ? W : 0) + (edge - (s ? W : 0)) * f / 6;
        cx.beginPath(); cx.moveTo(fx, 0); cx.lineTo(fx + dir * 8, H); cx.stroke();
      }
    }
    cx.fillStyle = '#5c1520'; cx.fillRect(0, 0, W, H * .07);
    caption(k, 'The Phantom of the Opera', '오페라의 유령 · 파리 오페라 극장 지하의 비밀', '#f0d9a8');
  }

  // 3. 젊은 베르테르의 슬픔 — 편지 위로 깃펜이 글씨를 쓴다
  function werther(k) {
    var g = cx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#2b3a55'); g.addColorStop(1, '#1b2436');
    cx.fillStyle = g; cx.fillRect(0, 0, W, H);
    // 촛불
    var fl = 1 + Math.sin(k * 40) * .06;
    var glow = cx.createRadialGradient(W * .82, H * .3, 2, W * .82, H * .3, W * .35);
    glow.addColorStop(0, 'rgba(255,200,120,.35)'); glow.addColorStop(1, 'rgba(255,200,120,0)');
    cx.fillStyle = glow; cx.fillRect(0, 0, W, H);
    cx.fillStyle = '#e8dcc0'; cx.fillRect(W * .81, H * .33, W * .02, H * .2);
    cx.fillStyle = '#ffcf6b'; cx.beginPath(); cx.ellipse(W * .82, H * .3, 4, 9 * fl, 0, 0, 7); cx.fill();
    // 편지지
    var px = W * .2, py = H * .14, pw = W * .5, ph = H * .58;
    cx.save(); cx.translate(px + pw / 2, py + ph / 2); cx.rotate(-.04);
    cx.fillStyle = '#f3ead6'; cx.fillRect(-pw / 2, -ph / 2, pw, ph);
    cx.restore();
    cx.save(); cx.translate(px + pw / 2, py + ph / 2); cx.rotate(-.04); cx.translate(-pw / 2, -ph / 2);
    cx.fillStyle = '#2c3550';
    cx.font = 'italic ' + Math.round(Math.min(W, H * 1.6) * .032) + 'px Georgia, serif';
    var lines = ['May 4.', 'How happy I am that', 'I am gone! My dear', 'friend, what a thing', 'is the heart of man!'];
    var all = lines.join('').length, shown = Math.floor(all * ease(k / .8)), used = 0, last = [0, 0];
    for (var i = 0; i < lines.length; i++) {
      var part = lines[i].slice(0, Math.max(0, shown - used));
      used += lines[i].length;
      var ly = ph * (.17 + i * .15);
      cx.fillText(part, pw * .1, ly);
      if (part.length) last = [pw * .1 + cx.measureText(part).width, ly];
    }
    // 깃펜 끝이 마지막 글자를 따라간다
    cx.translate(last[0], last[1]);
    cx.rotate(1.05);
    var q = H * .2;
    cx.strokeStyle = '#6f6656'; cx.lineWidth = 1.6;
    cx.beginPath(); cx.moveTo(0, 0); cx.lineTo(0, -q); cx.stroke();
    cx.fillStyle = 'rgba(122,132,156,.9)';
    cx.beginPath(); cx.moveTo(0, -q * .2);
    cx.quadraticCurveTo(q * .22, -q * .65, 0, -q * 1.05);
    cx.quadraticCurveTo(-q * .08, -q * .6, 0, -q * .2); cx.fill();
    cx.restore();
    // 창밖에서 떨어지는 잎
    for (var f = 0; f < 10; f++) {
      var fy = ((k * .6 + rnd(f)) % 1) * H, fx = W * rnd(f + 20) + Math.sin(k * 8 + f) * 12;
      cx.fillStyle = 'rgba(214,150,70,.7)';
      cx.beginPath(); cx.ellipse(fx, fy, 5, 2.5, k * 6 + f, 0, 7); cx.fill();
    }
    caption(k, 'The Sorrows of Young Werther', '젊은 베르테르의 슬픔 · 친구에게 보낸 편지들', '#cdd9f0');
  }

  // 4. 프랑켄슈타인 — 얼음 바다 위로 번개가 친다
  function frank(k) {
    var flash = 0;
    [.42, .5, .78].forEach(function (s) { var d = k - s; if (d > 0 && d < .06) flash = Math.max(flash, 1 - d / .06); });
    var g = cx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#0d1820'); g.addColorStop(1, '#2a4250');
    cx.fillStyle = g; cx.fillRect(0, 0, W, H);
    // 별
    for (var s = 0; s < 40; s++) {
      cx.fillStyle = 'rgba(255,255,255,' + (.3 + .5 * rnd(s + 5) * (.5 + .5 * Math.sin(k * 10 + s))) + ')';
      cx.fillRect(rnd(s) * W, rnd(s + 40) * H * .5, 1.5, 1.5);
    }
    // 얼음 봉우리
    cx.fillStyle = '#c9dbe5';
    cx.beginPath(); cx.moveTo(0, H * .76);
    for (var i = 0; i <= 10; i++) cx.lineTo(i * W / 10, H * (.56 + rnd(i + 70) * .14 + (i % 2) * .06));
    cx.lineTo(W, H * .76); cx.fill();
    cx.fillStyle = '#5d7d8e'; cx.fillRect(0, H * .7, W, H * .1);
    // 썰매 위의 작은 사람 그림자가 오른쪽으로 멀어진다
    var sx = W * (.15 + k * .6), sy = H * .69;
    cx.fillStyle = '#0d1820';
    cx.fillRect(sx - 14, sy, 28, 3);
    cx.fillRect(sx - 3, sy - 14, 6, 14);
    cx.beginPath(); cx.arc(sx, sy - 18, 4, 0, 7); cx.fill();
    // 번개
    if (flash > 0) {
      cx.strokeStyle = 'rgba(230,240,255,' + flash + ')'; cx.lineWidth = 2.5;
      var bx = W * (.3 + (k > .7 ? .35 : 0)), by = 0;
      cx.beginPath(); cx.moveTo(bx, by);
      for (var j = 1; j < 9; j++) { bx += (rnd(j + (k > .7 ? 50 : 0)) - .5) * W * .08; by = j * H * .07; cx.lineTo(bx, by); }
      cx.stroke();
      cx.fillStyle = 'rgba(220,235,255,' + flash * .35 + ')'; cx.fillRect(0, 0, W, H);
    }
    caption(k, 'Frankenstein', '프랑켄슈타인 · 북극에서 시작되는 이야기', '#d6e6f0');
  }

  var SC = [garden, opera, werther, frank];

  function draw(t) {
    t = ((t % TOTAL) + TOTAL) % TOTAL;
    var i = Math.floor(t / DUR), k = (t - i * DUR) / DUR;
    cx.clearRect(0, 0, W, H);
    SC[i](k);
    // 장면이 바뀔 때 어둡게 넘어간다
    var fade = Math.max(cl(1 - k / .06), cl((k - .94) / .06));
    if (fade > 0) { cx.fillStyle = 'rgba(0,0,0,' + fade + ')'; cx.fillRect(0, 0, W, H); }
    return i;
  }

  var playBtn = document.getElementById('play'), fill = document.getElementById('fill'),
      bar = document.getElementById('bar'), cards = document.querySelectorAll('.scene');
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var t = reduce ? DUR * .85 : 0, playing = !reduce, last = null, lastScene = -1;

  function paint() {
    var i = draw(t);
    fill.style.width = (t / TOTAL * 100) + '%';
    bar.setAttribute('aria-valuenow', Math.round(t));
    if (i !== lastScene) {
      for (var c = 0; c < cards.length; c++) cards[c].classList.toggle('on', c === i);
      lastScene = i;
    }
  }
  function loop(now) {
    if (playing) {
      if (last !== null) t = (t + (now - last) / 1000) % TOTAL;
      last = now; paint();
      requestAnimationFrame(loop);
    }
  }
  function setPlay(on) {
    playing = on; last = null; playBtn.textContent = on ? '멈춤' : '재생';
    if (on) requestAnimationFrame(loop);
  }
  playBtn.addEventListener('click', function () { setPlay(!playing); });
  playBtn.textContent = playing ? '멈춤' : '재생';

  function seek(e) {
    var r = bar.getBoundingClientRect();
    t = cl((e.clientX - r.left) / r.width) * TOTAL * .9999; last = null; paint();
  }
  bar.addEventListener('pointerdown', function (e) {
    seek(e); bar.setPointerCapture(e.pointerId);
    bar.onpointermove = seek;
  });
  bar.addEventListener('pointerup', function () { bar.onpointermove = null; });
  bar.addEventListener('keydown', function (e) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      t = ((t + (e.key === 'ArrowRight' ? 1 : -1)) + TOTAL) % TOTAL; last = null; paint(); e.preventDefault();
    }
  });
  bar.setAttribute('aria-valuemin', 0); bar.setAttribute('aria-valuemax', TOTAL);

  addEventListener('resize', function () { fit(); paint(); });
  fit(); paint();
  if (playing) requestAnimationFrame(loop);
})();
</script>
</body></html>
